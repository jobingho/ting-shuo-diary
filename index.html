.calendar{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.cal-header{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px}
.cal-nav{background:var(--paper);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}

.cal-wd{text-align:center;font-size:.78rem;color:#999;padding:6px 0}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cal-empty{visibility:hidden}

// ============ Weather ============
const WEATHERS=[
  {e:'☀️',t:'晴'},

  if(!w)return'';
  if(WEATHERS.some(x=>x.e===w))return w;
  const t=String(w).trim();
  const hit=WEATHERS.find(x=>x.t===t||t.includes(x.t));
  return hit?hit.e:t;
}

  return `${y}-${m}-${day}`;
}
function formatDisplay(d){

// ============ GitHub API ============
async function ghApi(path,method,body){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(`https://api.github.com${path}`,{
      method,
      signal:ctrl.signal,
      headers:{
        'Authorization':`token ${settings.token}`,
        'Accept':'application/vnd.github.v3+json',
        'Content-Type':'application/json'
      },
      body:body?JSON.stringify(body):undefined
    });
    clearTimeout(timer);
    if(res.status===404)return null;
    if(!res.ok){const t=await res.text();throw new Error(`GitHub ${res.status}: ${t.slice(0,200)}`);}
    return await res.json();
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}
// ============ Gist Data Operations ============
function getDiaryFile(dateStr){
  if(!isConfigured())return Promise.resolve(null);
  return ghApi(`/gists/${settings.gistId}`,'GET')
    .then(gist=>{
      if(!gist||!gist.files)return null;
      const f=gist.files[`${dateStr}.json`];
      if(!f||!f.content)return null;
      try{return JSON.parse(f.content);}catch(e){return null;}
    });
}
function saveDiaryFile(dateStr,data){
  if(!settings.token)return Promise.reject(new Error('未配置Token'));
  const content=JSON.stringify(data,null,2);
  // 如果没有 Gist ID，先创建一个新的
  const doSave=(gistId)=>{
    return ghApi(`/gists/${gistId}`,'GET')
      .then(gist=>{
        const files=gist?{...gist.files}:{};
        files[`${dateStr}.json`]={content};
        return ghApi(`/gists/${gistId}`,'PATCH',{
          description:`听说 · ${dateStr}`,
          files,
          public:false
        }).then(result=>result);
      });
  };
  if(settings.gistId){
    return doSave(settings.gistId);
  }
  // 首次：创建新 Gist
  return ghApi('/gists','POST',{
    description:'听说',
    public:false,
    files:{[`${dateStr}.json`]:{content}}
  }).then(result=>{
    if(result&&result.id){
      settings.gistId=result.id;
      saveSettings();
      // 同步更新设置面板显示
      const gidEl=$('setGistId');
      if(gidEl)gidEl.value=result.id;
      showToast(`已自动创建 Gist: ${result.id}`);
    }
    return result;
  });
}
function listAllDiaries(){
  if(!isConfigured())return Promise.resolve([]);
  return ghApi(`/gists/${settings.gistId}`,'GET')
    .then(gist=>{
      if(!gist||!gist.files)return[];
      return Object.keys(gist.files)
        .filter(n=>n.endsWith('.json'))
        .map(n=>n.replace('.json',''));
    })
    .catch(()=>[]);
}
// 拉取全量日记内容并入缓存（Gist 单次 GET 返回所有文件，顺便拿到天气供日历展示）
function fetchAllDiaries(){
  if(!settings.gistId||!settings.token)return Promise.resolve([]);
  return ghApi(`/gists/${settings.gistId}`,'GET').then(gist=>{
    if(!gist||!gist.files)return[];
    const dates=[];
    Object.keys(gist.files).forEach(name=>{
      if(!name.endsWith('.json'))return;
      const f=gist.files[name];
      try{
        const data=JSON.parse(f.content||'{}');
        const d=name.replace('.json','');
        if(!cache[d])cache[d]=data; // 本地有更新的不覆盖
        dates.push(d);
      }catch(e){}
    });
    saveCache();
    return dates;
  });
}

// ============ Marks (which days have entries) ============
function refreshMarks(){
  Object.keys(cache).forEach(d=>markedDates.add(d));
  if(isConfigured()){
    fetchAllDiaries().then(dates=>{
      dates.forEach(d=>markedDates.add(d));
      if(els.sectionCalendar.style.display!=='none')renderCalendar();
    }).catch(()=>{});
  }
}
function addMark(dateStr){markedDates.add(dateStr);if(els.sectionCalendar.style.display!=='none')renderCalendar();}

// ============ Calendar ============
let calView='day'; // 'day' | 'month' | 'year'

function renderCalendar(){
  const y=calYear,m=calMonth;
  let html='<div class="calendar">';
  // Header
  html+=`<div class="cal-header"><button class="cal-nav" id="btnCalPrev">◀</button><span class="cal-title" id="calTitle">${y}年 ${m+1}月</span><button class="cal-nav" id="btnCalNext">▶</button></div>`;

  // Day view
  html+=`<div class="cal-day-view" id="calDayView">`;
  const wd=['日','一','二','三','四','五','六'];
  html+='<div class="cal-grid cal-weekdays">'+wd.map(w=>`<div class="cal-cell cal-wd">${w}</div>`).join('')+'</div>';
  const first=new Date(y,m,1),startDay=first.getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=formatDate(new Date());
  html+='<div class="cal-grid">';
  for(let i=0;i<startDay;i++)html+='<div class="cal-cell cal-empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const marked=markedDates.has(ds);
    const wx=marked&&cache[ds]?weatherEmoji(cache[ds].weather):'';
    html+=`<div class="cal-cell cal-day${isToday?' cal-today':''}${marked?' cal-marked':''}" data-date="${ds}"><span class="cal-num">${d}</span>${wx?`<span class="cal-wx">${wx}</span>`:''}${marked?'<span class="cal-dot"></span>':''}</div>`;
  }
  html+='</div></div>';

  // Month picker (hidden by default)
  html+=`<div class="cal-picker" id="calMonthView"><div class="cal-month-grid">`;
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  months.forEach((name,i)=>{
    const cls=i===m?'cal-pick-item active':'cal-pick-item';
    html+=`<div class="${cls}" data-month="${i}">${name}</div>`;
  });
  html+='</div></div>';

  // Year picker (hidden by default)
  html+=`<div class="cal-picker" id="calYearView"><div class="cal-year-grid">`;
  const nowY=new Date().getFullYear();
  for(let yr=nowY;yr>=2001;yr--){
    const cls=yr===y?'cal-pick-item active':'cal-pick-item';
    html+=`<div class="${cls}" data-year="${yr}">${yr}</div>`;
  }
  html+='</div></div>';

  const cnt=markedDates.size;
  html+=`<div class="cal-tip">点击日期写日记 · 已记录 ${cnt} 篇</div></div>`;
  els.sectionCalendar.innerHTML=html;

  // Show correct view
  showCalView(calView);

  // Header nav events
  $('btnCalPrev').addEventListener('click',()=>navCal(-1));
  $('btnCalNext').addEventListener('click',()=>navCal(1));
  $('calTitle').addEventListener('click',()=>{
    if(calView==='day'){calView='month';showCalView('month');}
    else if(calView==='month'){calView='year';showCalView('year');}
  });

  // Day cells
  els.sectionCalendar.querySelectorAll('.cal-day').forEach(cell=>{
    cell.addEventListener('click',()=>openEditor(cell.dataset.date));
  });
  // Month picks
  els.sectionCalendar.querySelectorAll('#calMonthView .cal-pick-item').forEach(el=>{
    el.addEventListener('click',()=>{
      calMonth=parseInt(el.dataset.month);calView='day';renderCalendar();
    });
  });
  // Year picks
  els.sectionCalendar.querySelectorAll('#calYearView .cal-pick-item').forEach(el=>{
    el.addEventListener('click',()=>{
      calYear=parseInt(el.dataset.year);calView='month';renderCalendar();
    });
  });
}

function showCalView(view){
  calView=view;
  const dayV=$('calDayView'),monthV=$('calMonthView'),yearV=$('calYearView');
  const title=$('calTitle'),prev=$('btnCalPrev'),next=$('btnCalNext');
  dayV.style.display=view==='day'?'':'none';
  monthV.style.display=view==='month'?'':'none';
  yearV.style.display=view==='year'?'':'none';
  monthV.classList.toggle('show',view==='month');
  yearV.classList.toggle('show',view==='year');
  if(view==='day'){
    title.textContent=`${calYear}年 ${calMonth+1}月`;prev.style.display='';next.style.display='';
  }else if(view==='month'){
    title.textContent=`${calYear}年 · 选择月份`;prev.style.display='none';next.style.display='none';
  }else{
    title.textContent=`选择年份（2001-${new Date().getFullYear()}）`;prev.style.display='none';next.style.display='none';
  }
}

function navCal(dir){
  if(calView==='day'){
    calMonth+=dir;
    if(calMonth>11){calMonth=0;calYear++;}
    if(calMonth<0){calMonth=11;calYear--;}
  }else if(calView==='month'){
    calYear+=dir;
  }
  renderCalendar();
}

// ============ Views ============
function switchTab(tab){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  els.sectionWrite.style.display='none';
  els.sectionSearch.style.display=tab==='search'?'block':'none';
  els.sectionCalendar.style.display=tab==='calendar'?'block':'none';
  els.settingsPanel.style.display='none';
  if(tab==='calendar')renderCalendar();
  if(tab==='search')setTimeout(()=>els.searchInput.focus(),100);
}
function showCalendar(){switchTab('calendar');}
function openEditor(dateStr){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='calendar'));
  els.sectionCalendar.style.display='none';
  els.sectionSearch.style.display='none';
  els.settingsPanel.style.display='none';
  els.sectionWrite.style.display='block';
  els.sectionWrite.scrollTop=0;
  window.scrollTo(0,0);
  loadDiary(dateStr);
}

// ============ Load / Save ============
function loadDiary(dateStr){
  currentDate=dateStr;
  els.fieldDate.value=dateStr;
  els.currentDateDisplay.textContent=formatDisplay(new Date(dateStr+'T00:00:00'));
  const cached=getCached(dateStr);
  if(cached){setFormData(cached);showSync('已从本地加载','ok');return Promise.resolve();}
  showSync('正在加载...','syncing');
  return getDiaryFile(dateStr).then(data=>{
    if(data){setFormData(data);setCached(dateStr,data);showSync('已从云端加载','ok');}
    else{setFormData({date:dateStr});showSync('','');}
  }).catch(()=>{showSync('离线模式','err');});
}
function saveDiary(){
  const dateStr=els.fieldDate.value;
  if(!dateStr){showToast('请先选择日期');return;}
  const data=getFormData();
  setCached(dateStr,data);
  addMark(dateStr);
  if(!isConfigured()){showToast('已保存到本地');showSync('本地存储（请配置 Gist 以启用云同步）','err');return;}
  showSync('正在同步...','syncing');setLoading(true);
  saveDiaryFile(dateStr,data).then(()=>{
    showToast('保存成功 ✓');showSync('已同步至 Gist','ok');
  }).catch(err=>{
    showToast('云端同步失败，已存本地');showSync('同步失败，数据安全保存在本地','err');
  }).finally(()=>setLoading(false));
}

// ============ Search ============
function doSearch(){
  const q=els.searchInput.value.trim().toLowerCase();
  if(!q){els.searchResults.innerHTML='';return;}
  els.searchResults.innerHTML='<div class="search-empty">搜索中...</div>';
  let results=[];
  const dates=Object.keys(cache).sort().reverse();
  for(const d of dates){
    const c=cache[d];
    const text=[c.weather,c.events,c.breakfast,c.lunch,c.dinner,c.notes,c.inspiration,c.sleep].join(' ').toLowerCase();
    if(text.includes(q))results.push({date:d,preview:text});
  }
  if(isConfigured()){
    listAllDiaries().then(remoteDates=>{
      const cachedSet=new Set(dates);
      const pending=remoteDates.filter(d=>!cachedSet.has(d)).slice(0,20);
      renderSearch(results);
    }).catch(()=>renderSearch(results));
  }else{
    renderSearch(results);
  }
}
function renderSearch(results){
  if(!results.length){els.searchResults.innerHTML='<div class="search-empty">未找到匹配的日记</div>';return;}
  els.searchResults.innerHTML=results.map(r=>`
    <div class="search-result-item" onclick="window.__goToDate('${r.date}')">
      <div class="result-date">${r.date}</div>
      <div class="result-preview">${r.preview.slice(0,120)}</div>
    </div>
  `).join('');
}
window.__goToDate=function(dateStr){
  showCalendar();
  openEditor(dateStr);
};

// ============ Export ============
async function exportAll(){
  let output={};
  Object.assign(output,cache);
  if(isConfigured()){
    showSync('正在导出全部...','syncing');
    try{
      const dates=await listAllDiaries();
      for(const d of dates){
        if(!output[d]){const data=await getDiaryFile(d);if(data)output[d]=data;}
      }
    }catch(e){}
  }
  const keys=Object.keys(output).sort();
  if(!keys.length){showToast('没有可导出的日记');return;}
  let txt='';
  for(const k of keys){
    const d=output[k];
    txt+=`\n${'='.repeat(40)}\n  ${k}${d.weather?' · '+d.weather:''}\n${'='.repeat(40)}\n`;
    if(d.events)txt+=`\n【今日要事】\n${d.events}\n`;
    if(d.breakfast||d.lunch||d.dinner){
      txt+=`\n【今日美食】\n`;
      if(d.breakfast)txt+=`  早：${d.breakfast}\n`;
      if(d.lunch)txt+=`  午：${d.lunch}\n`;
      if(d.dinner)txt+=`  晚：${d.dinner}\n`;
    }
    if(d.notes)txt+=`\n【今日随记】\n${d.notes}\n`;
    if(d.inspiration)txt+=`\n【今日灵感】\n${d.inspiration}\n`;
    if(d.sleep)txt+=`\n【睡眠评分】\n${d.sleep}\n`;
  }
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`听说_${formatDate(new Date())}.txt`;
  a.click();URL.revokeObjectURL(a.href);
  showToast(`已导出 ${keys.length} 篇日记`);
  showSync('');
}

// ============ Init ============
function init(){
  loadSettings();
  loadCache();
  renderWeatherPicker();
  const now=new Date();
  calYear=now.getFullYear();
  calMonth=now.getMonth();
  refreshMarks();
  renderCalendar();

  // Form
  els.form.addEventListener('submit',e=>{e.preventDefault();saveDiary();});
  $('btnPrevDay').addEventListener('click',()=>{
    const d=new Date(currentDate+'T00:00:00');d.setDate(d.getDate()-1);loadDiary(formatDate(d));
  });
  $('btnNextDay').addEventListener('click',()=>{
    const d=new Date(currentDate+'T00:00:00');d.setDate(d.getDate()+1);loadDiary(formatDate(d));
  });
  $('btnToday').addEventListener('click',()=>loadDiary(formatDate(new Date())));
  els.fieldDate.addEventListener('change',()=>loadDiary(els.fieldDate.value));
  $('btnBackToCalendar').addEventListener('click',showCalendar);

  // Nav tabs
  document.querySelectorAll('.nav-tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

  // Search
  $('btnSearch').addEventListener('click',()=>switchTab('search'));
  let searchTimer=null;
  els.searchInput.addEventListener('input',()=>{
    clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,300);
  });

  // Settings
  $('btnSettings').addEventListener('click',()=>{
    const p=els.settingsPanel;p.style.display=p.style.display==='block'?'none':'block';
  });
  $('btnSaveSettings').addEventListener('click',saveSettings);
  $('btnTestConn').addEventListener('click',async()=>{
    const t=$('setToken').value.trim(),g=$('setGistId').value.trim();
    const msgEl=$('settingsMsg');
    if(!t){msgEl.style.color='#c62828';msgEl.textContent='✗ 请填写 Token';return;}
    msgEl.style.color='#1565c0';msgEl.textContent='⏳ 测试连接中...';
    const prev={...settings};
    settings.token=t;if(g)settings.gistId=g;
    // 测试方式：如果有 gistId 就读 Gist，否则只验证 Token（调 /user）
    const testUrl=g?`/gists/${g}`:'/user';
    try{
      const result=await ghApi(testUrl,'GET');
      if(result){
        if(g){
          msgEl.style.color='#2e7d32';
          msgEl.textContent=`✓ 连接成功！Gist 已找到（${Object.keys(result.files||{}).length} 个文件）（已自动保存）`;
        }else{
          msgEl.style.color='#2e7d32';
          msgEl.textContent=`✓ Token 有效！用户: ${result.login}（已自动保存，首次保存日记将自动创建 Gist）`;
        }
        settings=prev;saveSettings();showToast('连接成功 ✓');
      }else{
        msgEl.style.color='#c62828';
        msgEl.textContent=g?'✗ Gist 未找到，请检查 ID 是否正确':'✗ 验证失败';
      }
    }catch(err){
      settings=prev;
      msgEl.style.color='#c62828';
      let errMsg=err.message||err;
      msgEl.textContent=`✗ 连接失败: ${errMsg}`;
    }
  });
  $('btnExportAll').addEventListener('click',exportAll);

  // PWA SW (blob)
  if('serviceWorker'in navigator){
    try{
      const swCode='self.addEventListener(\'fetch\',e=>e.respondWith(fetch(e.request).catch(()=>new Response(\'Offline\'))));';
      const blob=new Blob([swCode],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob),{scope:'./'}).catch(()=>{});
    }catch(e){}
  }
}

init();

})();
